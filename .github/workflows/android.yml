name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      LARPCODE_KEYSTORE_PATH: ${{ runner.temp }}/larpcode.keystore
      LARPCODE_KEYSTORE_PASSWORD: ${{ secrets.LARPCODE_KEYSTORE_PASSWORD }}
      LARPCODE_KEY_ALIAS: ${{ secrets.LARPCODE_KEY_ALIAS }}
      LARPCODE_KEY_PASSWORD: ${{ secrets.LARPCODE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Generate Kotlin bindings
        run: scripts/generate-kotlin-bindings.sh

      - name: Check generated bindings
        run: git diff --exit-code -- android/app/src/main/java/dev/wingky530/larpcode/ffi

      - name: Build native libraries
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p larpcode-ffi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LARPCODE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LARPCODE_KEYSTORE_PATH"
          fi

      - name: Require fixed keystore
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f "$LARPCODE_KEYSTORE_PATH" ]; then
            echo "Missing LARPCODE_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK signature
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: larpcode-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
