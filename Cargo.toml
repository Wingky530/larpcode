[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"
repository = "https://github.com/wingky530/larpcode"

[workspace.dependencies]
larpcode-core = { path = "crates/larpcode-core" }
larpcode-ffi = { path = "crates/larpcode-ffi" }
larpcode-lsp = { path = "crates/larpcode-lsp" }
larpcode-plugin = { path = "crates/larpcode-plugin" }
larpcode-syntax = { path = "crates/larpcode-syntax" }
larpcode-terminal = { path = "crates/larpcode-terminal" }
larpcode-workspace = { path = "crates/larpcode-workspace" }
uniffi = "0.32.2"
